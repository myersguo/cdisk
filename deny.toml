[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "Unmaintained transitive dependency of Tauri urlpattern; tracked in docs/dependency-audit.md." },
  { id = "RUSTSEC-2025-0080", reason = "Unmaintained transitive dependency of Tauri urlpattern; tracked in docs/dependency-audit.md." },
  { id = "RUSTSEC-2025-0081", reason = "Unmaintained transitive dependency of Tauri urlpattern; tracked in docs/dependency-audit.md." },
  { id = "RUSTSEC-2025-0098", reason = "Unmaintained transitive dependency of Tauri urlpattern; tracked in docs/dependency-audit.md." },
  { id = "RUSTSEC-2025-0100", reason = "Unmaintained transitive dependency of Tauri urlpattern; tracked in docs/dependency-audit.md." },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
